[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-challenge-fase3"
version = "0.1.0"
description = "Fundacao, aquisicao e preparacao de dados do Assistente Clinico TechCare."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
  "unit: teste rapido e isolado, sem rede ou GPU",
  "integration: teste de integracao local, possivelmente com arquivos",
  "network: teste que acessa uma fonte externa",
  "gpu: teste que requer GPU e nunca integra a suite local padrao",
]
